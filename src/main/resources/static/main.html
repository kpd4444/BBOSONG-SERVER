<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀송이 메인</title>
    <style>
        :root {
            --bg: #f4f7ff;
            --card: #ffffff;
            --primary: #4b6bff;
            --primary-dark: #3552dc;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: radial-gradient(circle at top, #eef3ff 0%, var(--bg) 55%, #eef2f8 100%);
            color: var(--text);
        }
        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }
        .hero {
            background: linear-gradient(135deg, #4b6bff 0%, #7ca6ff 100%);
            color: white;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(75, 107, 255, 0.18);
        }
        .hero h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }
        .hero p {
            margin: 0;
            line-height: 1.6;
            opacity: 0.95;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .logout-btn {
            border: 0;
            background: rgba(255,255,255,0.18);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 26px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.09);
        }
        .emoji {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }
        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }
        @media (max-width: 640px) {
            .hero { padding: 24px; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="hero">
        <div class="topbar">
            <strong>BBOSONG</strong>
            <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </div>
        <h1>세탁과 옷 관리를 한 곳에서</h1>
        <p>옷 분석, AI 챗봇 상담, 내 옷장 관리를 한 번에 사용할 수 있는 메인 화면입니다.</p>
    </div>

    <div class="grid">
        <a class="card" href="/analyze.html">
            <div class="emoji">🧺</div>
            <h2>옷 분석하기</h2>
            <p>사진을 업로드해 소재, 세탁 방법, 주의사항을 확인합니다.</p>
        </a>

        <a class="card" href="/chat.html">
            <div class="emoji">💬</div>
            <h2>AI 챗봇</h2>
            <p>세탁 문제를 자연어로 질문하고 이미지와 함께 상담할 수 있습니다.</p>
        </a>

        <a class="card" href="/mypage.html">
            <div class="emoji">👕</div>
            <h2>내 옷장</h2>
            <p>회원 정보와 내 옷 관리 화면으로 이동합니다.</p>
        </a>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) {
        window.location.replace("/login.html");
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        window.location.replace("/login.html");
    });
</script>
</body>
</html>
