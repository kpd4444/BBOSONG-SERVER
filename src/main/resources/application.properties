spring.application.name=ai-laundry


spring.ai.openai.api-key=${OPENAI_API_KEY}
app.ai.model=gpt-4o-mini
app.ai.temperature=0.7
app.chat.history-limit=12
app.chat.retention-limit=100
app.jwt.secret=${JWT_SECRET_KEY}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/ai_laundry?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.kakao.rest-key=${KAKAO_REST_KEY}
